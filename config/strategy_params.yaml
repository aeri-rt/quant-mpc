# Strategy Parameters
# -------------------
# Configuration for trading strategies

# Gamma Scalping Strategy (Concept B)
gamma_scalping:
  enabled: true
  
  # Instrument Selection (simple rules)
  instrument_selection:
    # Option structure
    structure: "straddle"      # straddle, strangle
    strangle_width: 0.02       # If strangle: width as % of spot (e.g., 2%)
    
    # Strike selection
    strike_selection: "atm"    # atm, delta_neutral
    
    # Expiry selection
    target_dte: 30             # Target days to expiration
    min_dte: 21                # Minimum DTE for new positions
    max_dte: 45                # Maximum DTE for new positions
    
    # Roll parameters
    roll_dte: 7                # Roll when DTE reaches this
    roll_to_dte: 30            # Roll to this DTE
  
  # Position sizing
  position_sizing:
    method: "vol_premium"      # fixed, vol_premium, kelly
    
    # Fixed sizing
    fixed_contracts: 10
    
    # Vol premium sizing (scale with IV - RV)
    vol_premium:
      base_contracts: 5
      max_contracts: 20
      premium_threshold: 0.02  # Min IV-RV spread to trade
      scale_factor: 100        # contracts = base + scale * (IV - RV)
  
  # Entry conditions
  entry:
    min_vol_premium: 0.01      # Minimum IV - forecast_RV to enter
    min_gamma: 0.001           # Minimum gamma per contract
    max_theta: -50             # Maximum theta (daily) to pay
    
  # Exit conditions
  exit:
    take_profit: 0.20          # Close at 20% profit
    stop_loss: -0.30           # Close at 30% loss
    vol_collapse: 0.005        # Close if gamma drops below this
    
  # Delta hedging (MPC handles timing, these are constraints)
  hedging:
    hedge_instrument: "equity" # equity, options
    max_delta_exposure: 100    # Max unhedged delta (shares equivalent)
    min_hedge_size: 10         # Minimum hedge trade size (shares)
    
# Risk Management
risk:
  # Position limits
  max_contracts: 50            # Max option contracts
  max_notional: 100000         # Max notional exposure ($)
  max_loss_daily: 2000         # Max daily loss before shutdown
  
  # Greeks limits
  max_delta: 500               # Max portfolio delta (shares equiv)
  max_gamma: 100               # Max portfolio gamma
  max_vega: 5000               # Max portfolio vega ($)
  max_theta: -500              # Max portfolio theta ($/day)
  
  # Margin
  margin_buffer: 0.30          # Keep 30% margin buffer

# Paper Trading Settings
paper_trading:
  initial_capital: 100000
  simulate_slippage: true
  slippage_bps: 5              # 5 basis points slippage
  simulate_fill_delay: true
  fill_delay_ms: 100           # 100ms simulated fill delay

