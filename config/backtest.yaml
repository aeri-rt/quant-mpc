# Backtest Configuration
# ----------------------
# Default parameters for the gamma scalping backtest engine.
# Override any field via CLI or by editing this file.

# Time range
time:
  start_date: "2025-12-01"
  end_date: "2026-01-31"
  bar_size_minutes: 5

# Warmup (SimpleKappaEstimator needs ~60 bars before reliable MPC output)
warmup:
  warmup_bars: 60

# Capital and position sizing
capital:
  initial_capital: 100000.0
  position_size: 10          # Contracts per straddle leg
  target_dte: 30             # Target DTE for new straddles

# Position management
positions:
  roll_dte: 7                # Roll when DTE falls below
  roll_to_dte: 30            # Roll into this DTE
  take_profit_pct: 0.50
  stop_loss_pct: -0.30

# Volatility model
volatility:
  vix_scale_factor: 1.0      # Multiplier on VIX -> BS sigma
  # Note: intraday IV is constant per day (uses daily VIX close).
  # This is a known limitation -- finer IV would require intraday VIX or
  # option-derived IV, which isn't available offline.

# Market parameters
market:
  risk_free_rate: 0.045
  dividend_yield: 0.0106

# Transaction costs
costs:
  equity_slippage_bps: 1.0           # Basis points slippage on equity
  equity_commission_per_share: 0.005
  option_spread_dollars: 0.05        # Half bid-ask spread (ATM SPY)
  option_commission_per_contract: 0.65

# MPC overrides (match live config or tune separately)
mpc:
  mpc_horizon: 20
  mpc_q_max: 1000.0
  mpc_u_max: 200.0
  mpc_w_delta: 10.0

# Data paths
paths:
  cache_dir: "data/cache"
  output_dir: "data/backtest_results"
