# Backtest configuration → src.config.Backtest (strategy/cost/risk settings come from live_config)
live_config: config/live.yaml   # the strategy/cost/risk config the backtest validates
start: 2025-01-02
end: 2025-06-30
bar_s: 60                       # bar size = Runner interval; asserted equal to live.loop.interval_s unless overridden via --interval
source: synthetic               # synthetic | ibkr (cached bars from scripts/fetch_data.py); CLI --synthetic / --ibkr override
hedger: all                     # band | qp | naive | all
cache_dir: data/cache
out_dir: data/backtest_results
cache_version: 2                # bumps invalidate parquet caches (a poisoned fetch is never reused)
skew_b: 1.0                     # DDKZ haircut σ_atm = σ_var/√(1+3Tb²); b=1 gives VIX/ATM = √(1+3·30/365) ≈ 1.1165 at 30 d (a calibration knob, not a measured skew slope; never assert the rounded 1.12)
initial_nlv: 100000
synthetic: {sigma: 0.16, seed: 42, S0: 600.0, iv: 0.15}   # iv: implied level of the synthetic term structure (each node = iv·√(1+3·T·skew_b²), so atm_iv == iv at 9/30/91 d; between nodes it drifts < 0.4 vol-pt over 7–35 DTE, so sigma_iv ≠ iv in the daily CSV is expected; skew_b: 0 makes it exactly flat)
sweep_risk_aversion: {band: [1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5, 1.0e-5], qp: [3.0e-5, 1.0e-5, 3.0e-6, 1.0e-6, 3.0e-7]}
