# MPC/MHE Parameters
# ------------------
# Tuning parameters for Model Predictive Control and Moving Horizon Estimation

# Time discretization
time:
  dt: 60.0             # Time step in seconds (1 minute default)
  
# MPC Controller Parameters
mpc:
  # Horizon
  horizon: 20          # Prediction horizon (N steps)
  
  # Solver settings
  solver:
    name: "ipopt"      # ipopt, qpoases
    max_iter: 100
    tol: 1.0e-6
    print_level: 0     # 0=silent, 5=verbose
  
  # Cost function weights
  # Objective: Σ [ w_exec * (c_quad * u² + c_lin * |u|) + w_delta * σ * Δ² + w_rate * (u_t - u_{t-1})² ] + w_terminal * Δ_final²
  weights:
    execution_cost: 1.0      # Penalize trading (transaction costs)
    delta_deviation: 10.0    # Penalize delta exposure (scaled by volatility)
    delta_rate: 0.1          # Penalize rapid delta changes (smoothness)
    terminal_delta: 100.0    # Terminal cost on delta (end of horizon)
    
  # Transaction cost model
  costs:
    c_quad: 0.001            # Quadratic cost per share² (market impact)
    c_lin: 0.01              # Linear cost per share (spread + commission)
  
  # Constraints
  constraints:
    # Position limits (shares of SPY)
    max_position: 1000
    min_position: -1000
    
    # Trade rate limits (shares per step)
    max_trade_rate: 200
    
    # Delta bounds (portfolio delta in shares equivalent)
    max_delta: 500
    min_delta: -500

# MHE Estimator Parameters
mhe:
  # Horizon
  horizon: 50          # Estimation horizon (past observations)
  
  # What to estimate
  estimate:
    realized_vol: true
    mean_reversion: true
  
  # Solver settings
  solver:
    name: "ipopt"
    max_iter: 50
    tol: 1.0e-5
    print_level: 0
  
  # Process noise covariance (Q)
  process_noise:
    price: 0.01        # Price process noise
    vol: 0.001         # Volatility process noise
  
  # Measurement noise covariance (R)  
  measurement_noise:
    price: 0.0001      # Price measurement noise

# Mean Reversion Model (from Clinet paper)
# Price dynamics: dS = κ(S̄ - S)dt + σdW
mean_reversion:
  # Initial estimates (will be updated by MHE)
  kappa_init: 0.1      # Mean reversion speed
  kappa_min: 0.0       # Min allowed value
  kappa_max: 1.0       # Max allowed value
  
  # Reference price (S̄)
  reference: "ema"     # ema, vwap, arrival
  ema_span: 20         # EMA lookback for reference price

# Aggressiveness in the money (from Clinet paper)
# Controls how much to accelerate trading when price is favorable
aggressiveness:
  enabled: true
  intensity: 0.5       # 0 = ignore price, 1 = very aggressive

