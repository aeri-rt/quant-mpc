[project]
name = "quant-mpc"
version = "0.1.0"
description = "MPC-based quantitative trading system for SPY options and equities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RTN"}
]

dependencies = [
    # MPC/MHE Framework
    "do-mpc>=4.6.0",
    "casadi>=3.6.0",
    
    # Numerical Computing
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    
    # Broker Integration
    "ib_insync>=0.9.86",
    
    # Data Providers
    "polygon-api-client>=1.12.0",
    
    # Options Pricing (reference implementation)
    "py_vollib>=1.0.1",
    
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    
    # Async
    "asyncio>=3.4.3",
    "nest-asyncio>=1.5.0",  # For Jupyter compatibility
    
    # Logging
    "loguru>=0.7.0",
    
    # Utilities
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    
    # Backtesting data
    "yfinance>=0.2.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    
    # Linting & Formatting
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    
    # Jupyter
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

