[project]
name = "quant-mpc"
version = "0.2.0"
description = "Gated long-gamma SPY straddle, delta-hedged by a cost-aware band (Whalley-Wilmott) with a closed-form receding-horizon QP as research path"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "RTN"}]
dependencies = [
  "ib_async>=2.1,<3",
  "numpy>=2,<2.5",  # pandas 2.3 on numpy 2.5 warns on generic timedelta units (lock-drift, 2026-10-18)
  "scipy>=1.11,<2",
  "pandas>=2,<3",
  "pyarrow>=14",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "loguru>=0.7,<1",
  "exchange_calendars>=4.5,<5",
  "tzdata>=2024.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6,<7", "ruff>=0.5", "matplotlib>=3.7", "py_vollib>=1.0.1"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DTZ", "ASYNC"]
ignore = ["E501", "B008"]
[tool.ruff.lint.isort]
known-first-party = ["src", "backtest", "scripts", "tests"]   # tests import `from scripts.run_paper import …` (batch 4)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --tb=short"
